version: "3.8"

services:
  redis:
    image: redis:latest
    container_name: redis
    restart: on-failure:3
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    image: asia-northeast3-docker.pkg.dev/neurous-b290f/neurous/neurous-api:${IMAGE_TAG}
    container_name: neurous-api
    restart: on-failure:3
    depends_on:
      - redis
    ports:
      - "8080:8080"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - TZ=Asia/Seoul

volumes:
  redis_data:

