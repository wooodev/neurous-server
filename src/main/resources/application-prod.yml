spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger

logging:
  level:
    root: INFO
