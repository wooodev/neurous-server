spring:
  application:
    name: server
  profiles:
    default: local
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  tomcat:
    accesslog:
      enabled: true
      pattern: '%h %l %u %t "%r" %s %b %D'
      directory: /tmp
      prefix: access
      suffix: .log

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  refresh-expiration: 2592000000

app:
  backend:
    base-url: ${APP_BACKEND_URL}

oauth:
  kakao:
    user-info-url: https://kapi.kakao.com/v2/user/me
    unlink-url: https://kapi.kakao.com/v1/user/unlink
  google:
    user-info-url: https://www.googleapis.com/oauth2/v2/userinfo
    revoke-url: https://oauth2.googleapis.com/revoke
  naver:
    user-info-url: https://openapi.naver.com/v1/nid/me
    token-url: https://nid.naver.com/oauth2.0/token
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
  apple:
    token-url: https://appleid.apple.com/auth/token
    revoke-url: https://appleid.apple.com/auth/revoke
    client-id: ${APPLE_CLIENT_ID}
    team-id: ${APPLE_TEAM_ID}
    key-id: ${APPLE_KEY_ID}
    private-key: ${APPLE_PRIVATE_KEY} # p8 문자열(개행 포함이면 환경변수 처리 방식 주의)

naver:
  openapi:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    base-url: https://openapi.naver.com
    display: 10
    sort: date

news:
  crawling:
    per-category-size: 5
    request-delay-ms: 200
    user-agent: "Mozilla/5.0 (compatible; NeuroS/1.0; +https://example.com)"
    category-query:
      POLITICS: "정치 OR 국회 OR 대통령 OR 여당 OR 야당"
      ECONOMY: "경제 OR 금리 OR 환율 OR 물가 OR 주식 OR 코스피 OR 코스닥"
      SOCIETY: "사회 OR 사건 OR 사고 OR 법원 OR 검찰 OR 경찰 OR 교육"
      LIFE_CULTURE: "생활 OR 문화 OR 공연 OR 전시 OR 여행"
      IT_SCIENCE: "IT OR 과학 OR AI OR 반도체 OR 로봇 OR 우주"
      WORLD: "세계 OR 미국 OR 중국 OR 일본 OR 유럽 OR 중동"

clova:
  base-url: https://clovastudio.stream.ntruss.com/v1/openai
  model: HCX-003
  api-key: ${CLOVA_API_KEY}
  timeout-ms: 20000

content:
  generation:
    per-category-size: 10
    max-retries: 3

google:
  gemini:
    api-key: ${GEMINI_API_KEY}
    base-url: https://generativelanguage.googleapis.com
    model: gemini-2.5-flash-image
    timeout-ms: 20000
    max-rpm: 10
    max-retries: 3
    base-backoff-ms: 800
    max-backoff-ms: 15000

gcs:
  object-storage:
    provider: gcs
    bucket: ${GCS_BUCKET:neurous-bucket}
    prefix: ${GCS_PREFIX:dev/news-images}
    public-base-url: ${GCS_PUBLIC_BASE_URL:https://storage.googleapis.com/neurous-bucket}
    profile-path: ${PROFILE_PATH:dev/profile/}
    character-path: ${CHARACTER_PATH:dev/character/}
