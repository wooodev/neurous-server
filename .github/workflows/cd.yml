name: CD

on:
  push:
    branches: [ develop, main ]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build (no test)
        run: ./gradlew clean build -x test

      - name: Set tag
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_JSON }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev -q

      - name: Build & Push Image (Artifact Registry)
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/neurous/neurous-api:${TAG}"
          IMAGE_LATEST="${REGION}-docker.pkg.dev/${PROJECT_ID}/neurous/neurous-api:latest"

          docker build -t "${IMAGE}" -t "${IMAGE_LATEST}" .
          docker push "${IMAGE}"
          docker push "${IMAGE_LATEST}"

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cd-build-debug
          path: |
            build/reports/**
            build/test-results/**
            build/libs/**
            **/build/reports/**
            **/build/test-results/**

  deploy_dev:
    needs: build_and_push
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check docker-compose exists
        run: ls -al docker-compose.yml

      - name: Prepare SSH key (DEV)
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_PORT: ${{ secrets.DEV_PORT || 22 }}
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
        run: |
          if [ -z "$DEV_SSH_KEY" ]; then echo "DEV_SSH_KEY missing" && exit 1; fi
          echo "DEV_SSH_KEY length: ${#DEV_SSH_KEY}"

          mkdir -p ~/.ssh
          printf "%s" "$DEV_SSH_KEY" > ~/.ssh/dev_deploy_key
          chmod 600 ~/.ssh/dev_deploy_key

          ssh-keyscan -p "$DEV_PORT" -H "$DEV_HOST" >> ~/.ssh/known_hosts

      - name: Copy docker-compose to DEV
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          port: ${{ secrets.DEV_PORT || 22 }}
          key_path: ~/.ssh/dev_deploy_key
          source: "docker-compose.yml"
          target: "/home/ubuntu/neurous"
          overwrite: true

      - name: Deploy to DEV
        uses: appleboy/ssh-action@v1.0.3
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          IMAGE_TAG: ${{ needs.build_and_push.outputs.tag }}
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          port: ${{ secrets.DEV_PORT || 22 }}
          key_path: ~/.ssh/dev_deploy_key
          envs: GCP_PROJECT_ID,GCP_REGION,IMAGE_TAG
          script: |
            cd /home/ubuntu/neurous

            export GCP_PROJECT_ID="$GCP_PROJECT_ID"
            export IMAGE_TAG="$IMAGE_TAG"

            docker compose up -d --force-recreate --remove-orphans

  deploy_prod:
    needs: build_and_push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check docker-compose exists
        run: ls -al docker-compose.yml

      - name: Prepare SSH key (PROD)
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT || 22 }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          if [ -z "$PROD_SSH_KEY" ]; then echo "PROD_SSH_KEY missing" && exit 1; fi
          echo "PROD_SSH_KEY length: ${#PROD_SSH_KEY}"

          mkdir -p ~/.ssh
          printf "%s" "$PROD_SSH_KEY" > ~/.ssh/prod_deploy_key
          chmod 600 ~/.ssh/prod_deploy_key

          ssh-keyscan -p "$PROD_PORT" -H "$PROD_HOST" >> ~/.ssh/known_hosts

      - name: Copy docker-compose to PROD
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          port: ${{ secrets.PROD_PORT || 22 }}
          key_path: ~/.ssh/prod_deploy_key
          source: "docker-compose.yml"
          target: "/home/ubuntu/neurous"
          overwrite: true

      - name: Deploy to PROD
        uses: appleboy/ssh-action@v1.0.3
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          IMAGE_TAG: ${{ needs.build_and_push.outputs.tag }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          port: ${{ secrets.PROD_PORT || 22 }}
          key_path: ~/.ssh/prod_deploy_key
          envs: GCP_PROJECT_ID,GCP_REGION,IMAGE_TAG
          script: |
            cd /home/ubuntu/neurous

            export GCP_PROJECT_ID="$GCP_PROJECT_ID"
            export IMAGE_TAG="$IMAGE_TAG"

            docker compose up -d --force-recreate --remove-orphans
