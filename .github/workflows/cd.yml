name: CD

on:
  push:
    branches: [ develop, main ]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build (no test)
        run: ./gradlew clean build -x test

      - name: Set tag
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_JSON }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev -q

      - name: Build & Push Image (Artifact Registry)
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/neurous/neurous-api:${TAG}"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"
          
      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cd-build-debug
          path: |
            build/reports/**
            build/test-results/**
            build/libs/**
            **/build/reports/**
            **/build/test-results/**


  deploy_dev:
    needs: build_and_push
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose to DEV
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/neurous"

      - name: Deploy to DEV
        uses: appleboy/ssh-action@v0.1.6
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          IMAGE_TAG: ${{ needs.build_and_push.outputs.tag }}
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          envs: GCP_PROJECT_ID,GCP_REGION,IMAGE_TAG
          script: |
            cd /opt/neurous
            mv deploy/docker-compose.yml ./docker-compose.yml 2>/dev/null || true

            # 서버에서 Artifact Registry pull 가능해야 함 (권한/인증)
            export GCP_PROJECT_ID="$GCP_PROJECT_ID"
            export IMAGE_TAG="$IMAGE_TAG"
            docker compose up -d --force-recreate --remove-orphans

  deploy_prod:
    needs: build_and_push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose to PROD
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/neurous"

      - name: Deploy to PROD
        uses: appleboy/ssh-action@v0.1.6
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          IMAGE_TAG: ${{ needs.build_and_push.outputs.tag }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: GCP_PROJECT_ID,GCP_REGION,IMAGE_TAG
          script: |
            cd /home/ubuntu/neurous
            mv docker-compose.yml ./docker-compose.yml 2>/dev/null || true

            export GCP_PROJECT_ID="$GCP_PROJECT_ID"
            export IMAGE_TAG="$IMAGE_TAG"
            docker compose up -d --force-recreate --remove-orphans
